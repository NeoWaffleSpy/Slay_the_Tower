<style>
    .artefactPage {
        anchor-height: 500;
        anchor-width: 1000;
    }

    .artefactTab {
        layout-mode: LeftCenterWrap;
        padding: 6;
    }

    .buttonColumn {
        anchor-top: 10;
        anchor-width: 300;
        anchor-height: 410;
        flex-weight: 1;
        layout-mode: MiddleCenter;
    }

    .artefactColumn {
        anchor-width: 300;
        anchor-height: 420;
        flex-weight: 1;
        layout-mode: MiddleCenter;
        background-color: #ff000000;
    }

    .colElem {
        padding: 5;
        layout-mode: MiddleCenter;
    }

    .artefactImgBox {
        flex-weight: 4;
        background-color: #ff000000;
    }

    .artefactTitleBox {
        flex-weight: 4;
        background-color: #ff00ff00;
    }

    .artefactStatsBox {
        flex-weight: 6;
        background-color: #00ff0000;
        anchor-width: 300;
        layout-mode: Middle;
    }

    .artefactDescBox {
        flex-weight: 9;
        background-color: #0000ff00;
        anchor-width: 300;
        layout-mode: Top;
    }

    .artefactRarityBox {
        flex-weight: 1;
        background-color: #0000ff00;
        anchor-width: 300;
        layout-mode: Middle;
    }

    .textbutton {
        flex-weight: 1;
    }

    .icon {
        anchor-width: 96;
        anchor-height: 96;
    }

    .txt {
        white-space: wrap;
    }

    .txtName {
        font-size: 20;
    }

    .txtEffects {
        font-size: 16;
        anchor-top: 5;
    }

    .txtDesc {
        color: #999999;
        font-size: 18;
    }

    .grey {
        color: #ffffff;
    }

    .blue {
        color: #3295ff;
    }

    .orange {
        color: #ffa600;
    }

    .txt16 {
        font-size: 16;
    }
</style>
<div class='page-overlay'>
    <div class='decorated-container artefactPage' data-hyui-title='Artefact Reward'>
        <div class='container-contents'>
            <div class='artefactTab'>
                {{#each artefacts}}
                <button id='my-button-{{$index}}' class='raw-button buttonColumn'>
                    <div class='artefactColumn'>
                        <div class='colElem artefactImgBox'>
                            <img class='icon' src='{{$icon}}'>
                        </div>
                        <div class='colElem artefactTitleBox'>
                            {{#if rarity == 0}}<p class='txt txtName grey'>{{/if}}
                            {{#if rarity == 1}}<p class='txt txtName blue'>{{/if}}
                            {{#if rarity == 2}}<p class='txt txtName orange'>{{/if}}
                            {{$name}}</p>
                        </div>
                        <div class='artefactDescBox'>
                            {{$description}}
                        </div>
                        <div class='artefactRarityBox'>
                            {{#if rarity == 0}}<p class='txt txt16 grey'>Common</p>{{/if}}
                            {{#if rarity == 1}}<p class='txt txt16 blue'>Rare</p>{{/if}}
                            {{#if rarity == 2}}<p class='txt txt16 orange'>Legendary</p>{{/if}}
                        </div>
                    </div>
                </button>
                {{/each}}
            </div>
        </div>
    </div>
</div>
